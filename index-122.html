<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1a12">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coffee Farm">
<title>Daniel Coffee Farm Manager</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{--roast:#2b1a12;--cherry:#a8222c;--leaf:#4a7a3a;--bg:#f2f3ee;--card:#fff;--ink:#24170f;--mute:#7a6d63;--line:#e0e0d8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh}
header{background:var(--roast);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px}
header h1{margin:0;font:700 19px Georgia,serif}
header p{margin:2px 0 0;font-size:13px;color:#d9c7b8}
main{flex:1;overflow-y:auto;padding:14px 14px 20px}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:10px 2px;font-size:12px;color:var(--mute);min-height:52px}
nav button b{display:block;font-size:19px;font-weight:400}
nav button.on{color:var(--cherry);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:10px;padding:12px;border-left:4px solid var(--leaf)}
.stat.red{border-color:var(--cherry)}
.stat small{color:var(--mute);font-size:12px}
.stat div{font:700 20px Georgia,serif;margin-top:2px}
h2{font:700 16px Georgia,serif;margin:16px 0 8px}
.row{background:var(--card);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--mute);margin-top:2px}
.amt{font-weight:700;white-space:nowrap}
.in{color:var(--leaf)}.out{color:var(--cherry)}
.bar{height:8px;background:#e7e8e0;border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cherry)}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);background:var(--cherry);color:#fff;border:0;border-radius:28px;padding:14px 20px;font-size:16px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.late{color:var(--cherry);font-weight:700}
.done .t{text-decoration:line-through;color:var(--mute)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:9}
#modal.show{display:flex}
#sheet{background:#fff;width:100%;max-height:92dvh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
#sheet h3{margin:0 0 10px;font:700 18px Georgia,serif}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;font-size:16px;padding:11px;border:1px solid #cfcfc6;border-radius:8px;background:#fff;color:var(--ink)}
.btns{display:flex;gap:8px;margin-top:16px}
.btns button{flex:1;padding:13px;font-size:16px;border:0;border-radius:8px;font-weight:700}
.save{background:var(--leaf);color:#fff}.cancel{background:#e7e8e0;color:var(--ink)}.del{background:#fff;color:var(--cherry);border:1px solid var(--cherry)!important}
.tools{display:flex;gap:8px;margin-top:10px}
.tools button{flex:1;padding:12px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:14px}
#login{position:fixed;inset:0;z-index:20;background:var(--roast);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:24px}
#login h2{font:700 24px Georgia,serif;margin:0 0 4px}
#login p{color:#d9c7b8;margin:0 0 12px}
#login label{color:#d9c7b8}
#login button{margin-top:18px;width:100%;padding:14px;border:0;border-radius:8px;background:var(--cherry);color:#fff;font-size:16px;font-weight:700}
#lerr{color:#ffb4b4;margin-top:10px;min-height:20px}
</style>
</head>
<body>
<header><h1>Daniel Coffee Farm Manager</h1><p id="sub"></p><p id="st"></p></header>
<main id="main"></main>
<button class="fab" id="fab">+ Add</button>
<nav id="nav"></nav>
<div id="login"><h2>Daniel Coffee Farm</h2><p>Sign in to open your farm records.</p>
<label for="em">Email</label><input id="em" type="email" autocomplete="username">
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
<button onclick="signIn()">Sign in</button><div id="lerr"></div></div>
<div id="modal"><div id="sheet"></div></div>
<input type="file" id="file" accept=".json" hidden>

<script>
var KEY='daniel-coffee-farm-v1';
var TABS=[['home','☕','Home'],['plots','🌱','Plots'],['harvest','🧺','Harvest'],['money','💰','Money'],['tasks','✅','Tasks']];
var CATS=['Labour','Fertiliser','Pesticide / spray','Seedlings','Transport','Pulping / processing','Equipment','Other'];
var VARS=['SL28','SL34','Ruiru 11','Batian','K7'];
var S=load(),tab='home';
var firebaseConfig={
 apiKey:"AIzaSyCZTN1iYBOST9hJOE8V6qtjKaSj70vQQ7k",
 authDomain:"daniel-coffee-farm.firebaseapp.com",
 projectId:"daniel-coffee-farm",
 storageBucket:"daniel-coffee-farm.firebasestorage.app",
 messagingSenderId:"403399902188",
 appId:"1:403399902188:web:5ca96e01072e5b4e38b6c9"
};
var auth=null,unsubs=[],db=null,TYPES=['plots','harvest','money','tasks'];
try{
 firebase.initializeApp(firebaseConfig);
 db=firebase.firestore();
 db.settings({experimentalAutoDetectLongPolling:true,merge:true});
 db.enablePersistence({synchronizeTabs:true}).catch(function(){});
 auth=firebase.auth();
}catch(e){db=null;auth=null}
function signIn(){
 var e=$('em').value.trim(),p=$('pw').value;$('lerr').textContent='';
 if(!e||!p){$('lerr').textContent='Enter your email and password.';return}
 auth.signInWithEmailAndPassword(e,p).catch(function(x){$('lerr').textContent=x.code=='auth/network-request-failed'?'No connection. Try again when online.':'Wrong email or password.'});
}
function cPut(t,r){if(db)db.collection(t).doc(r.id).set(r).catch(function(){})}
function cDel(t,id){if(db)db.collection(t).doc(id).delete().catch(function(){})}
function cVars(){if(db)db.collection('meta').doc('varieties').set({list:S.varieties||[]}).catch(function(){})}
function setStatus(snap){
 var t='Saved on this phone only';
 if(db){t=!navigator.onLine?'Offline · will sync when connected':(!snap||snap.metadata.fromCache)?'Connecting…':snap.metadata.hasPendingWrites?'Saving…':'Synced';}
 $('st').textContent='● '+t;
}
function listen(){
 setStatus();
 if(!db)return;
 var seen={};
 TYPES.forEach(function(t){
  unsubs.push(db.collection(t).onSnapshot({includeMetadataChanges:true},function(snap){
   if(!snap.metadata.fromCache&&!seen[t]){
    seen[t]=1;
    if(snap.empty&&S[t].length){S[t].forEach(function(r){cPut(t,r)});setStatus(snap);return}
   }
   if(snap.metadata.fromCache&&snap.empty&&S[t].length){setStatus(snap);return}
   S[t]=snap.docs.map(function(d){return d.data()});
   save();render(true);setStatus(snap);
  },function(){setStatus()}));
 });
 unsubs.push(db.collection('meta').doc('varieties').onSnapshot(function(d){
  if(d.exists){S.varieties=d.data().list||[];save()}
  else if(!d.metadata.fromCache&&(S.varieties||[]).length)cVars();
 },function(){}));
 window.addEventListener('online',function(){setStatus()});
 window.addEventListener('offline',function(){setStatus()});
}
function blank(){return {plots:[],harvest:[],money:[],tasks:[],varieties:[]}}
function load(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return blank()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Could not save on this device.')}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function num(n){return Number(n||0).toLocaleString('en-KE',{maximumFractionDigits:1})}
function kes(n){return 'KES '+Math.round(n||0).toLocaleString('en-KE')}
function today(){return new Date().toISOString().slice(0,10)}
function plotName(id){var p=S.plots.filter(function(x){return x.id==id})[0];return p?p.name:'—'}
function plotOpts(opt){return (opt?[['','None']]:[]).concat(S.plots.map(function(p){return [p.id,p.name]}))}

var FORMS={
 plots:{title:'Plot',f:[['name','Plot name','text',1],['trees','Number of trees','number'],['variety','Variety','select',0,'VAR'],['year','Year planted','number'],['acres','Size (acres)','number']]},
 harvest:{title:'Harvest',f:[['date','Date','date',1],['plot','Plot','select',1,null],['kg','Cherry picked (kg)','number',1],['grade','Grade','select',0,[['Grade 1','Grade 1'],['Grade 2','Grade 2'],['Mbuni','Mbuni']]],['note','Notes','text']]},
 money:{title:'Entry',f:[['date','Date','date',1],['type','Type','select',1,[['Expense','Expense'],['Income','Income']]],['cat','Category','select',0,CATS.map(function(c){return [c,c]}).concat([['Coffee sales','Coffee sales']])],['amount','Amount (KES)','number',1],['note','Notes','text']]},
 tasks:{title:'Task',f:[['title','What needs doing?','text',1],['due','Due date','date'],['plot','Plot','select',0,null],['type','Activity','select',0,['Pruning','Weeding','Fertilising','Spraying','Mulching','Picking','Other'].map(function(c){return [c,c]})]]}
};

function render(keep){
 var st=$('main').scrollTop;
 $('nav').innerHTML=TABS.map(function(t){return '<button class="'+(t[0]==tab?'on':'')+'" onclick="go(\''+t[0]+'\')"><b>'+t[1]+'</b>'+t[2]+'</button>'}).join('');
 $('fab').style.display=tab=='home'?'none':'block';
 $('sub').textContent=new Date().toLocaleDateString('en-KE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 $('main').innerHTML=({home:home,plots:plots,harvest:harvest,money:money,tasks:tasks})[tab]();
 $('main').scrollTop=keep?st:0;
}
function go(t){tab=t;render()}

function home(){
 var yr=new Date().getFullYear()+'',kg=0,inc=0,exp=0,trees=0,byPlot={};
 S.plots.forEach(function(p){trees+=+p.trees||0;byPlot[p.id]=0});
 S.harvest.forEach(function(h){if((h.date||'').slice(0,4)==yr){kg+=+h.kg;byPlot[h.plot]=(byPlot[h.plot]||0)+ +h.kg}});
 S.money.forEach(function(m){if((m.date||'').slice(0,4)==yr){if(m.type=='Income')inc+=+m.amount;else exp+=+m.amount}});
 var max=Math.max.apply(null,Object.keys(byPlot).map(function(k){return byPlot[k]}).concat([1]));
 var open=S.tasks.filter(function(t){return !t.done}).sort(function(a,b){return (a.due||'9')>(b.due||'9')?1:-1}).slice(0,4);
 var h='<div class="grid"><div class="stat"><small>Plots / trees</small><div>'+S.plots.length+' / '+num(trees)+'</div></div>'+
 '<div class="stat"><small>Cherry picked '+yr+'</small><div>'+num(kg)+' kg</div></div>'+
 '<div class="stat"><small>Income '+yr+'</small><div class="in">'+kes(inc)+'</div></div>'+
 '<div class="stat red"><small>Expenses '+yr+'</small><div class="out">'+kes(exp)+'</div></div></div>'+
 '<div class="stat '+(inc-exp<0?'red':'')+'"><small>Profit '+yr+'</small><div>'+kes(inc-exp)+'</div></div>';
 h+='<h2>Harvest by plot</h2>';
 h+=S.plots.length?S.plots.map(function(p){var v=byPlot[p.id]||0;return '<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span class="t">'+esc(p.name)+'</span><span class="amt">'+num(v)+' kg</span></div><div class="bar"><i style="width:'+(v/max*100)+'%"></i></div></div>'}).join(''):'<div class="empty">Add your first plot to see harvest totals.</div>';
 h+='<h2>Next tasks</h2>';
 h+=open.length?open.map(taskRow).join(''):'<div class="empty">No open tasks.</div>';
 h+='<h2>Backup</h2><div class="tools"><button onclick="exportData()">Save backup</button><button onclick="$(\'file\').click()">Restore backup</button>'+(auth?'<button onclick="auth.signOut()">Sign out</button>':'')+'</div>';
 return h;
}
function plots(){
 return S.plots.length?S.plots.map(function(p){return '<div class="row" onclick="openForm(\'plots\',\''+p.id+'\')"><div><div class="t">'+esc(p.name)+'</div><div class="s">'+esc(p.variety||'')+(p.year?' · planted '+esc(p.year):'')+(p.acres?' · '+esc(p.acres)+' acres':'')+'</div></div><div class="amt">'+num(p.trees)+' trees</div></div>'}).join(''):'<div class="empty">No plots yet. Tap + Add to record a block of trees.</div>';
}
function harvest(){
 var l=S.harvest.slice().sort(function(a,b){return a.date<b.date?1:-1});
 return l.length?l.map(function(h){return '<div class="row" onclick="openForm(\'harvest\',\''+h.id+'\')"><div><div class="t">'+esc(plotName(h.plot))+'</div><div class="s">'+esc(h.date)+' · '+esc(h.grade||'')+(h.note?' · '+esc(h.note):'')+'</div></div><div class="amt">'+num(h.kg)+' kg</div></div>'}).join(''):'<div class="empty">No picking records yet. Tap + Add after each picking day.</div>';
}
function money(){
 var l=S.money.slice().sort(function(a,b){return a.date<b.date?1:-1});
 return l.length?l.map(function(m){var i=m.type=='Income';return '<div class="row" onclick="openForm(\'money\',\''+m.id+'\')"><div><div class="t">'+esc(m.cat||m.type)+'</div><div class="s">'+esc(m.date)+(m.note?' · '+esc(m.note):'')+'</div></div><div class="amt '+(i?'in':'out')+'">'+(i?'+':'−')+kes(m.amount)+'</div></div>'}).join(''):'<div class="empty">No money entries yet. Record coffee sales and farm costs here.</div>';
}
function taskRow(t){
 var late=!t.done&&t.due&&t.due<today();
 return '<div class="row '+(t.done?'done':'')+'"><div onclick="openForm(\'tasks\',\''+t.id+'\')" style="flex:1"><div class="t">'+esc(t.title)+'</div><div class="s">'+esc(t.type||'')+(t.plot?' · '+esc(plotName(t.plot)):'')+(t.due?' · <span class="'+(late?'late':'')+'">'+(late?'Overdue ':'Due ')+esc(t.due)+'</span>':'')+'</div></div><input type="checkbox" style="width:26px;height:26px" '+(t.done?'checked':'')+' onchange="toggle(\''+t.id+'\')"></div>';
}
function tasks(){
 var l=S.tasks.slice().sort(function(a,b){return (a.done-b.done)||((a.due||'9')>(b.due||'9')?1:-1)});
 return l.length?l.map(taskRow).join(''):'<div class="empty">No tasks yet. Add pruning, spraying, weeding and fertiliser jobs.</div>';
}
function toggle(id){S.tasks.forEach(function(t){if(t.id==id){t.done=!t.done;cPut('tasks',t)}});save();render()}

function varOpts(v){
 var l=VARS.concat(S.varieties||[]);
 if(v&&l.indexOf(v)<0)l.push(v);
 return l.map(function(x){return [x,x]}).concat([['__new','+ Add new variety…']]);
}
function newVar(sel){
 if(sel.value!='__new')return;
 var n=(prompt('Name of the new variety')||'').trim();
 if(!n){sel.selectedIndex=0;return}
 var all=VARS.concat(S.varieties||[]);
 if(all.indexOf(n)<0){S.varieties=(S.varieties||[]).concat([n]);save();cVars();
  var o=document.createElement('option');o.value=n;o.textContent=n;sel.insertBefore(o,sel.lastChild)}
 sel.value=n;
}
var cur=null;
function openForm(type,id){
 var F=FORMS[type],rec=id?S[type].filter(function(r){return r.id==id})[0]:{};
 cur={type:type,id:id};
 var h='<h3>'+(id?'Edit ':'New ')+F.title.toLowerCase()+'</h3>';
 F.f.forEach(function(f){
  var v=rec[f[0]]!=null?rec[f[0]]:(f[2]=='date'?today():'');
  h+='<label>'+f[1]+(f[3]?' *':'')+'</label>';
  if(f[2]=='select'){
   var opts=f[4]=='VAR'?varOpts(v):(f[4]||plotOpts(type=='tasks'));
   h+='<select id="f_'+f[0]+'"'+(f[4]=='VAR'?' onchange="newVar(this)"':'')+'>'+opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]==v?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>';
  }else h+='<input id="f_'+f[0]+'" type="'+f[2]+'" '+(f[2]=='number'?'inputmode="decimal" step="any"':'')+' value="'+esc(v)+'">';
 });
 h+='<div class="btns"><button class="cancel" onclick="closeForm()">Cancel</button><button class="save" onclick="saveForm()">Save</button></div>';
 if(id)h+='<div class="btns"><button class="del" onclick="delRec()">Delete</button></div>';
 $('sheet').innerHTML=h;$('modal').classList.add('show');
}
function closeForm(){$('modal').classList.remove('show')}
function saveForm(){
 var F=FORMS[cur.type],rec={};
 for(var i=0;i<F.f.length;i++){
  var f=F.f[i],v=$('f_'+f[0]).value.trim();
  if(f[3]&&!v){alert(f[1]+' is required.');return}
  rec[f[0]]=v;
 }
 if(cur.type=='harvest'&&!S.plots.length){alert('Add a plot first.');return}
 if(cur.id){S[cur.type]=S[cur.type].map(function(r){if(r.id==cur.id){Object.assign(r,rec);cPut(cur.type,r)}return r})}
 else{rec.id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);if(cur.type=='tasks')rec.done=false;S[cur.type].push(rec);cPut(cur.type,rec)}
 save();closeForm();render();
}
function delRec(){
 if(!confirm('Delete this record?'))return;
 S[cur.type]=S[cur.type].filter(function(r){return r.id!=cur.id});
 cDel(cur.type,cur.id);
 if(cur.type=='plots')S.harvest=S.harvest.filter(function(h){if(h.plot==cur.id){cDel('harvest',h.id);return false}return true});
 save();closeForm();render();
}
function exportData(){
 var a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
 a.download='daniel-coffee-farm-'+today()+'.json';a.click();
}
$('file').onchange=function(e){
 var f=e.target.files[0];if(!f)return;
 var r=new FileReader();
 r.onload=function(){try{var d=JSON.parse(r.result);if(!confirm('Replace current data with this backup?'))return;var old=S;S=Object.assign(blank(),d);
  TYPES.forEach(function(t){old[t].forEach(function(x){if(!S[t].some(function(y){return y.id==x.id}))cDel(t,x.id)});S[t].forEach(function(x){cPut(t,x)})});
  cVars();save();render()}catch(x){alert('That file is not a valid backup.')}};
 r.readAsText(f);e.target.value='';
};
$('fab').onclick=function(){openForm(tab)};
$('modal').onclick=function(e){if(e.target==this)closeForm()};
render();
if(auth&&db){auth.onAuthStateChanged(function(u){
 if(u){$('login').style.display='none';listen()}
 else{unsubs.forEach(function(f){f()});unsubs=[];$('login').style.display='flex'}
})}else{$('login').style.display='none';listen()}
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
</body>
</html>
